name: Fingerprint backend checks

on:
  push:
    branches:
      - feat/clearcote-backend
      - release/1.9.7
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/fingerprint-backends.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --registry=https://registry.npmmirror.com --no-audit --no-fund
      - name: Adapter regression and kernel isolation
        working-directory: frontend
        run: node scripts/test-fingerprint-adapters.mjs
      - name: Compile frontend
        working-directory: frontend
        run: npm run build
      - name: Backend regression
        run: go test ./backend/...
      - name: Compile backend
        run: go build ./backend
