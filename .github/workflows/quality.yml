name: Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go tests
        run: go test ./backend/... ./internal/... ./tools/...

      - name: Go vet
        run: go vet ./backend/... ./internal/... ./tools/...

      - name: Compile all Go packages
        run: go test -run '^$' ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build
