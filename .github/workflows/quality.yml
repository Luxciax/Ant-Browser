name: Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check repository consistency
        run: node tools/check-repo-consistency.mjs

      - name: Go tests
        run: go test -p=1 ./backend/... ./internal/... ./tools/...

      - name: Go vet
        run: go vet ./backend/... ./internal/... ./tools/...

      - name: Compile all Go packages
        run: go test -run '^$' -p=1 ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build
